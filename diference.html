<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 150px;
  height: 50px;
  margin: 10px;
  padding: 10px;
  color: white;
}
.static { background: gray; position: static; }
.relative { background: blue; position: relative; top: 10px; left: 20px; }
.absolute-container { position: relative; height: 100px; background: lightgray; }
.absolute { background: red; position: absolute; top: 10px; right: 10px; }
.fixed { background: green; position: fixed; bottom: 10px; right: 10px; }
.sticky { background: orange; position: sticky; top: 0; }
</style>
</head>
<body>

<div class="box static">Static</div>
<div class="box relative">Relative</div>

<div class="absolute-container">
  <div class="box absolute">Absolute</div>
</div>

<div class="box sticky">Sticky (scroll down)</div>

<p style="height: 1000px;">Scroll to see fixed and sticky in action.</p>

<div class="box fixed">Fixed</div>

</body>
</html>
